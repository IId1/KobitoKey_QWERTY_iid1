# スプリットキーボード子機2（Peripheral: wrist_mouse）設定
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

CONFIG_ZMK_BLE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# PMW3360 ドライバー設定
CONFIG_INPUT_PIXART_PMW3360=y
CONFIG_INPUT_PIXART_PMW3360_USE_OWN_THREAD=y

# BLE 送信電力向上 (+8dBm) ＆ 高レート移動時のパケット詰まり防止バッファ拡張
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# バッテリー報告
CONFIG_ZMK_BATTERY_REPORTING=y

# 省電力スリープ設定 (15分無操作でスリープ)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
